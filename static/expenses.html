<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error("Global error:", msg, url, line);
        };
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Expenses - Vault</title>
    <meta name="theme-color" content="#0E0E0E">

    <!-- Icons -->
    <link rel="icon" href="/static/pficon.png">
    <link rel="apple-touch-icon" href="/static/pficon.png">
    <link rel="manifest" href="/static/site.webmanifest">

    <!-- Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vault">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Vault Theme -->
    <link rel="stylesheet" href="/static/styles/vault-theme.css?v=1790799600">
</head>
<body>
    <nav-bar></nav-bar>
    <toast-container></toast-container>

    <div class="container py-3">
        <!-- Dual Mode Pill Switcher -->
        <div class="mode-switch-container mb-3">
            <a href="/" class="mode-switch-btn" id="modeLogBtn">
                <span class="material-symbols-outlined" style="font-size: 1.125rem;">bolt</span>
                <span>Log Expense</span>
            </a>
            <a href="/expenses" class="mode-switch-btn active" id="modeBrowseBtn">
                <span class="material-symbols-outlined" style="font-size: 1.125rem;">payments</span>
                <span>Browse</span>
            </a>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3 mt-1">
            <span class="text-label-sm" style="color: var(--outline);">
                <span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: text-bottom;">bar_chart</span>
                Monthly Overview
            </span>
            <div class="d-flex align-items-center gap-2">
                <a href="/reconcile" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1" style="border-radius: 0.5rem; font-weight: 600; text-decoration: none; padding: 0.25rem 0.6rem; font-size: 0.8rem;">
                    <span class="material-symbols-outlined" style="font-size: 1rem;">link</span> Reconcile
                </a>
                <backup-button></backup-button>
            </div>
        </div>

        <date-navigation></date-navigation>
        <category-chart></category-chart>

        <!-- Expenses List Widget with Inline Edit -->
        <div class="mt-4">
            <latest-expenses period="all"></latest-expenses>
        </div>
    </div>

    <!-- Core Modules -->
    <script type="module" src="/static/components/config.js?v=1783245000"></script>
    <script type="module" src="/static/components/api-service.js?v=1783245000"></script>
    <script type="module" src="/static/components/event-manager.js?v=1783245000"></script>

    <!-- Custom Components -->
    <script src="/static/components/navbar.js?v=1790799600"></script>
    <script type="module" src="/static/components/toast.js?v=1783245000"></script>
    <script type="module" src="/static/components/date-navigation.js?v=1783245000"></script>
    <script type="module" src="/static/components/category-chart.js?v=1783245000"></script>
    <script type="module" src="/static/components/backup-button.js?v=1783245000"></script>
    <script type="module" src="/static/components/latest-expenses.js?v=1783245000"></script>
</body>
